name: Idea or integration request
description: Suggest an improvement, material profile, or mod integration.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Suggestions in English or German are welcome. Search existing issues first.
        Synthesis is limited to explicitly permitted raw and natural materials, fluids and gases; manufactured components, equipment and machines stay in their existing production chains.
  - type: textarea
    id: need
    attributes:
      label: What would this improve?
      description: Describe the use case or missing support.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Your suggestion
      description: Describe the behavior you would like and any alternatives you considered.
    validations:
      required: true
  - type: textarea
    id: integration
    attributes:
      label: Related mods or materials
      description: If relevant, include mod names, versions, item or fluid IDs, and links.
