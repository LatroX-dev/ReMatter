name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research-io-windows:
    name: Research authority I/O on Windows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Test real filesystem publication and research recovery
        run: >-
          .\gradlew.bat test --rerun-tasks --no-daemon
          --tests "dev.latrox.rematter.research.ResearchAuthorityTest"
          --tests "dev.latrox.rematter.research.ResearchSessionsTest"
          --tests "dev.latrox.rematter.research.ConversionClaimsTest"
      - name: Test native server payments and rollback on Windows
        run: .\gradlew.bat runGameTestServer --no-daemon
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Build and run unit tests
        run: ./gradlew build --rerun-tasks --no-daemon
      - name: Test optional integration configuration merge
        run: python3 -m unittest discover -s integrations/reforging/tests -p 'test_*.py'
      - name: Test real server machines in an isolated world
        run: ./gradlew runGameTestServer --no-daemon
      - name: Verify curated material data matches generated resources
        run: python3 tools/generate_material_data.py --check
      - name: Verify generated workshop materials
        run: python3 tools/generate_workshop_materials.py --check
      - name: Verify generated machine assets
        run: python3 tools/generate_visual_assets.py --check
      - name: Verify generated machine family assets
        run: python3 tools/generate_family_assets.py --check
      - name: Verify generated server bench shapes
        run: python3 tools/generate_bench_shapes.py --check
      - name: Verify generated GUI skins
        run: python3 tools/generate_gui_assets.py --check
      - name: Verify generated module assets
        run: python3 tools/generate_module_assets.py --check
      - name: Verify generated Cell Transfer Station
        run: python3 tools/generate_cell_transfer_assets.py --check
      - name: Verify generated cell models
        run: python3 tools/generate_cell_models.py --check
      - name: Verify generated components
        run: python3 tools/generate_component_assets.py --check
      - name: Verify illustrated replacement icons
        run: python3 tools/generate_illustrated_icons.py --check
      - name: Verify generated advanced material icons
        run: python3 tools/generate_advanced_material_icons.py --check
      - name: Verify generated metallurgy assets
        run: python3 tools/generate_metallurgy_assets.py --check
      - name: Verify generated research data
        run: python3 tools/generate_research_data.py --check
      - name: Verify generated Primal assets
        run: python3 tools/generate_primal_assets.py --check
      - name: Verify generated energy cube assets
        run: python3 tools/generate_energy_assets.py --check
      - name: Verify generated progression assets
        run: python3 tools/generate_progression_assets.py --check
      - name: Verify generated player guidance
        run: python3 tools/generate_player_guidance.py --check
      - name: Check asset integrity
        run: python3 tools/check_assets.py
      - name: Test asset generator contracts and Primal alternatives
        run: python3 -m unittest discover -s tools/tests -p 'test_*.py'
      - name: Test the visual style check
        run: python3 tools/check_visual_style.py --selftest
      - name: Check assets against the visual style guide
        run: python3 tools/check_visual_style.py
      - name: Verify specialist device assets and recipes
        run: python3 tools/generate_device_assets.py --check
